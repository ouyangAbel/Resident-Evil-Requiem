<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#120808;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e4e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c41e1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="900" height="320" fill="url(#bg)"/>
  <circle cx="450" cy="190" r="160" fill="url(#glow)"/>
  <!-- Hospital cross motif -->
  <rect x="430" y="80" width="40" height="160" rx="2" fill="none" stroke="#8b0000" stroke-width="0.8" opacity="0.15"/>
  <rect x="390" y="120" width="120" height="40" rx="2" fill="none" stroke="#8b0000" stroke-width="0.8" opacity="0.15"/>
  <!-- Decorative circles -->
  <circle cx="450" cy="190" r="120" fill="none" stroke="#8b0000" stroke-width="0.4" opacity="0.2"/>
  <circle cx="450" cy="190" r="90" fill="none" stroke="#8b0000" stroke-width="0.3" opacity="0.15"/>
  <circle cx="450" cy="190" r="60" fill="none" stroke="#8b0000" stroke-width="0.2" opacity="0.1"/>
  <!-- Grid lines -->
  <line x1="0" y1="160" x2="900" y2="160" stroke="#8b0000" stroke-width="0.2" opacity="0.1"/>
  <line x1="450" y1="0" x2="450" y2="320" stroke="#8b0000" stroke-width="0.2" opacity="0.1"/>
  <!-- Main text -->
  <text x="450" y="185" font-family="Bebas Neue, Arial Black, sans-serif" font-size="100" fill="url(#text)" text-anchor="middle" opacity="0.1">PART 2</text>
  <text x="450" y="230" font-family="Bebas Neue, Arial Black, sans-serif" font-size="36" fill="#c41e1e" text-anchor="middle" opacity="0.18">GRACE HOSPITAL &amp; LEON BOSS FIGHTS</text>
  <!-- Subtitle -->
  <text x="450" y="285" font-family="DM Mono, monospace" font-size="11" fill="#5a5550" text-anchor="middle" letter-spacing="0.2em">CHAPTERS VII &mdash; XII &bull; HUNK &bull; VICTOR GIDEON &bull; ALL COLLECTIBLES</text>
  <!-- Border -->
  <rect x="1" y="1" width="898" height="318" fill="none" stroke="#2a2520" stroke-width="1"/>
  <!-- Scan lines -->
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="4" y2="0" stroke="#8b0000" stroke-width="0.5" opacity="0.03"/>
  </pattern>
  <rect width="900" height="320" fill="url(#scanlines)"/>
</svg>
