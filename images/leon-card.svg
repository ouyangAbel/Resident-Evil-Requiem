<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e4e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c41e1e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Subtle glow effect -->
  <circle cx="200" cy="150" r="120" fill="url(#glow)"/>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="80" fill="none" stroke="#8b0000" stroke-width="0.5" opacity="0.3"/>
  <circle cx="200" cy="150" r="60" fill="none" stroke="#8b0000" stroke-width="0.3" opacity="0.2"/>
  <circle cx="200" cy="150" r="40" fill="none" stroke="#8b0000" stroke-width="0.2" opacity="0.1"/>
  
  <!-- Cross lines -->
  <line x1="200" y1="70" x2="200" y2="230" stroke="#8b0000" stroke-width="0.3" opacity="0.2"/>
  <line x1="120" y1="150" x2="280" y2="150" stroke="#8b0000" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Leon text -->
  <text x="200" y="160" font-family="Bebas Neue, Arial Black, sans-serif" font-size="72" fill="url(#text)" text-anchor="middle" opacity="0.8">LEON</text>
  
  <!-- Subtle border -->
  <rect x="1" y="1" width="398" height="298" fill="none" stroke="#2a2520" stroke-width="1"/>
</svg>
