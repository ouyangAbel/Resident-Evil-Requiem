        .article-content a:hover{border-bottom-color:var(--accent-light)}<div class="toc"><div class="toc-title">TABLE OF CONTENTS</div><ul class="toc-list"><li class="toc-act">Act I &mdash; The Estate</li><li><a href="#chapter1">Chapter I &mdash; The Ashen Arrival</a></li><li><a href="#chapter2">Chapter II &mdash; Echoes of the Estate</a></li><li><a href="#chapter3">Chapter III &mdash; Below the Surface</a></li><li class="toc-act">Act II &mdash; Betrayal &amp; The Laboratory</li><li><a href="#chapter4">Chapter IV &mdash; The Crimson Wing</a></li><li><a href="#chapter5">Chapter V &mdash; Betrayal in the Dark</a></li><li><a href="#chapter6">Chapter VI &mdash; The Living Laboratory</a></li><li class="toc-act">Act III &mdash; The Requiem</li><li><a href="#chapter7">Chapter VII &mdash; The Requiem Begins</a></li><li><a href="#chapter8">Chapter VIII &mdash; Dimensions Apart</a></li><li><a href="#chapter9">Chapter IX &mdash; The Forgotten City</a></li><li><a href="#chapter10">Chapter X &mdash; Convergence</a></li><li><a href="#chapter11">Chapter XI &mdash; The Final Descent</a></li><li><a href="#chapter12">Chapter XII &mdash; Requiem</a></li><li><a href="#faq">FAQ: Resident Evil Requiem Chapters</a></li></ul></div><h2>QUICK REFERENCE: ALL 12 CHAPTERS AT A GLANCE</h2><p>Before we dive into the details, here is a quick reference table showing every chapter, its approximate playtime, and main boss encounter.</p><table class="quick-table"><thead><tr><th>Chapter</th><th>Title</th><th>Playtime</th><th>Boss</th></tr></thead><tbody><tr><td class="ch-num">I</td><td>The Ashen Arrival</td><td>30&ndash;45 min</td><td>&mdash;</td></tr><tr><td class="ch-num">II</td><td>Echoes of the Estate</td><td>60&ndash;90 min</td><td>&mdash;</td></tr><tr><td class="ch-num">III</td><td>Below the Surface</td><td>45&ndash;60 min</td><td>The Bloated Lycan</td></tr><tr><td class="ch-num">IV</td><td>The Crimson Wing</td><td>50&ndash;70 min</td><td>&mdash;</td></tr><tr><td class="ch-num">V</td><td>Betrayal in the Dark</td><td>40&ndash;55 min</td><td>&mdash;</td></tr><tr><td class="ch-num">VI</td><td>The Living Laboratory</td><td>60&ndash;80 min</td><td>The Abomination</td></tr><tr><td class="ch-num">VII</td><td>The Requiem Begins</td><td>50&ndash;65 min</td><td>&mdash;</td></tr><tr><td class="ch-num">VIII</td><td>Dimensions Apart</td><td>55&ndash;70 min</td><td>Shadow Stalker</td></tr><tr><td class="ch-num">IX</td><td>The Forgotten City</td><td>70&ndash;100 min</td><td>The Forgotten King (optional)</td></tr><tr><td class="ch-num">X</td><td>Convergence</td><td>45&ndash;60 min</td><td>&mdash;</td></tr><tr><td class="ch-num">XI</td><td>The Final Descent</td><td>50&ndash;65 min</td><td>The Amalgam</td></tr><tr><td class="ch-num">XII</td><td>Requiem</td><td>40&ndash;60 min</td><td>Final Boss</td></tr></tbody></table><div class="highlight-box"><p><strong>Total playtime:</strong> A first playthrough of all 12 chapters takes approximately 10&ndash;14 hours on Standard difficulty. Completionist runs (all collectibles, all secrets) can push that to 25&ndash;30 hours.</p></div><h2>WALKTHROUGH VIDEO: ALL CHAPTERS OVERVIEW</h2><p>Watch this complete walkthrough overview to see every chapter in action. The video covers the key story beats, boss encounters, and hidden collectibles across all 12 chapters.</p><div class="video-embed"><iframe src="https://www.youtube.com/embed/2hmycq7r4SY" title="Resident Evil Requiem - All Chapters Full Walkthrough" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div><p class="video-caption">Full gameplay walkthrough covering all 12 chapters of Resident Evil Requiem</p><div class="illustration-panel"><img src="images/chapters-act1.svg" alt="Resident Evil Requiem Act I - The Estate Grounds Chapters 1-3" loading="lazy"></div><h2 id="act1">ACT I: THE ESTATE GROUNDS (CHAPTERS I&ndash;III)</h2><p>The first three chapters of Resident Evil Requiem establish the setting, introduce core mechanics, and immerse players in the oppressive atmosphere of the estate. These chapters are slower-paced and exploration-heavy, emphasizing resource management and puzzle-solving over combat.</p><div class="chapter-card fade-in" id="chapter1"><div class="chapter-number">01</div><div class="chapter-label">Opening Chapter &bull; 30&ndash;45 min</div><div class="chapter-title">THE ASHEN ARRIVAL</div><p>Resident Evil Requiem opens with your protagonist arriving at a remote European estate under a relentless rainstorm. The wrought-iron gates are broken, the guardhouse is abandoned, and the first signs of violence are everywhere. Chapter I serves as the game's tutorial, teaching movement, combat basics, and item interaction without excessive hand-holding.</p><p><strong>Key objectives:</strong> Enter the estate grounds, find the Gate Key in the guardhouse, collect the Combat Knife from the dead officer near the fountain, and reach the main mansion entrance. The first Typewriter save point is in the entrance hall's left corridor.</p><p><strong>Enemies:</strong> Three basic Lycans appear in the courtyard. An explosive barrel near the well can kill two of them instantly. The third can be dodged by sprinting to the front door.</p><p><strong>Why it matters:</strong> The Guard's Journal found in the guardhouse contains the safe code (1492) needed in Chapter II. Read every document you find.</p></div><div class="chapter-card fade-in" id="chapter2"><div class="chapter-number">02</div><div class="chapter-label">Exploration-Heavy &bull; 60&ndash;90 min</div><div class="chapter-title">ECHOES OF THE ESTATE</div><p>The mansion interior is a masterclass in atmospheric design. Creaking floorboards, distant moans, and the flicker of candlelight create constant unease. Chapter II is the longest chapter in Act I and contains several critical puzzles that gate your progression through the estate.</p><p><strong>Key objectives:</strong> Explore the ground floor (dining room, kitchen, library, main hall), solve the Grandfather Clock Puzzle (set to 11:45 using the clue from the dining room painting), find the Handgun in the locked study (code: 1492 from Chapter I), obtain the West Wing Key from the master bedroom safe, and locate the underground passage.</p><p><strong>Enemies:</strong> Five standard zombies roam the mansion. Two burst through the dining room windows in a scripted encounter.</p><p><strong>Why it matters:</strong> This chapter establishes the exploration loop that defines the game. Thorough exploration rewards you with Shotgun Parts, herbs, treasures, and crucial lore documents.</p></div><div class="chapter-card fade-in" id="chapter3"><div class="chapter-number">03</div><div class="chapter-label">First Boss &bull; 45&ndash;60 min</div><div class="chapter-title">BELOW THE SURFACE</div><p>The underground passage beneath the mansion leads to a network of tunnels that once served as smuggling routes. Chapter III is tense and linear, with limited resources and some of the game's most claustrophobic encounters. It culminates in the first real boss fight.</p><p><strong>Key objectives:</strong> Navigate the tunnel system (follow red wall markings), drain the flooded chamber by solving the Water Valve Puzzle (right, left, center), find the Tunnel Key, and defeat the chapter boss.</p><p><strong>Boss: The Bloated Lycan.</strong> This swollen creature guards the tunnel exit. It attacks with sweeping claws and ranged acid vomit. Maintain medium distance, dodge the acid sideways, and fire during recovery windows. Explosive canisters near the walls deal massive damage. Approximately 20 handgun rounds or 4 shotgun blasts on Standard difficulty.</p><p><strong>Why it matters:</strong> This chapter transitions the game from exploration into combat survival. The Bloated Lycan teaches you boss-phase thinking that will be essential for every major encounter ahead.</p></div><div class="illustration-panel"><img src="images/chapters-act2.svg" alt="Resident Evil Requiem Act II - Betrayal and The Laboratory Chapters 4-6" loading="lazy"></div><h2 id="act2">ACT II: BETRAYAL &amp; THE LABORATORY (CHAPTERS IV&ndash;VI)</h2><p>Act II raises the stakes dramatically. An ally's betrayal shifts the narrative into high gear, the estate transforms into a combat arena, and the underground laboratory reveals the scientific horror beneath the surface.</p><div class="chapter-card fade-in" id="chapter4"><div class="chapter-number">04</div><div class="chapter-label">Mansion Revisited &bull; 50&ndash;70 min</div><div class="chapter-title">THE CRIMSON WING</div><p>Returning to the mansion reveals that everything has changed. New, more aggressive enemy variants patrol the halls, and previously visited areas now contain fresh threats and new item placements. The Crimson Wing introduces the Crimson Lycan &mdash; a faster, deadlier variant that can leap across rooms in a single bound.</p><p><strong>Key objectives:</strong> Collect the Shotgun from the newly accessible armory, survive the three-wave Crimson Lycan ambush in the main hall, obtain the Garden Key, navigate the garden maze (right, left, straight through hedge gap, left at statue, right at fountain), and reach the greenhouse.</p><p><strong>Why it matters:</strong> The Shotgun becomes your primary weapon from this point forward. The garden maze contains the Emerald Brooch, one of the most valuable treasures in the game.</p></div><div class="chapter-card fade-in" id="chapter5"><div class="chapter-number">05</div><div class="chapter-label">Narrative Turning Point &bull; 40&ndash;55 min</div><div class="chapter-title">BETRAYAL IN THE DARK</div><p>This is the game's most dramatic chapter. An ally reveals their true intentions, and the story pivots from survival horror to desperate escape. Gameplay shifts to a more urgent, linear pace as the estate begins to collapse around you.</p><p><strong>Key objectives:</strong> Survive the betrayal cutscene (earlier choices affect dialogue), escape the collapsing wine cellar within 3 minutes (Standard difficulty), find the Emergency Keycard on a dead soldier near the collapsed archway, and reach the elevator to the underground laboratory.</p><p><strong>Pro tip:</strong> During the timed escape, do not fight enemies &mdash; sprint through debris and follow the lit torches. At the fork, take the left path (the right is a dead end with a Gold Ingot treasure).</p><p><strong>Why it matters:</strong> This chapter permanently changes the game's tone. The trust you placed in earlier characters is shattered, and every NPC encounter afterward carries new tension.</p></div><div class="video-embed"><iframe src="https://www.youtube.com/embed/TGNxKhbByAA" title="Resident Evil Requiem Boss Fight - The Abomination" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div><p class="video-caption">The Abomination boss fight &mdash; Chapter VI boss strategy</p><div class="chapter-card fade-in" id="chapter6"><div class="chapter-number">06</div><div class="chapter-label">Major Boss Fight &bull; 60&ndash;80 min</div><div class="chapter-title">THE LIVING LABORATORY</div><p>The underground laboratory is the game's most complex area. Interconnected rooms, security systems, and disturbing environmental storytelling make this chapter a methodical exploration challenge. Two critical puzzles gate your progress, and the chapter ends with the first major boss encounter.</p><p><strong>Key objectives:</strong> Restore the power system (find three fuses in the break room, operating theater, and storage room), access the Research Wing with Security Clearance B, solve the Specimen Tank Puzzle (align tubes: Red-Blue-Green-Yellow), obtain the Master Keycard from the high-security vault, and defeat The Abomination.</p><p><strong>Boss: The Abomination.</strong> A grotesque fusion of multiple test subjects with three distinct phases. Phase 1: target two glowing weak points on the torso with shotgun blasts. Phase 2: it grows extra arms; dodge the ground slam shockwave and fire during recovery. Phase 3: lure it near explosive canisters that spawn around the arena.</p><p><strong>Why it matters:</strong> This is the game's difficulty spike. The Abomination demands everything you have learned: resource management, pattern recognition, environmental awareness, and precise aiming.</p></div><div class="chapter-card fade-in" id="chapter10"><div class="chapter-number">10</div><div class="chapter-label">Combat Gauntlet &bull; 45&ndash;60 min</div><div class="chapter-title">CONVERGENCE</div><p>The dimensional barriers collapse. Both worlds merge into a single nightmarish landscape. Chapter X is a gauntlet of combat encounters with minimal exploration, building intensity toward the finale.</p><p><strong>Key objectives:</strong> Fight through three consecutive arena encounters, protect the NPC ally during the 4-minute bridge defense sequence, and reach the Convergence Point.</p><p><strong>Pro tip:</strong> Stock up on shotgun ammo and grenades before the bridge defense. Focus fire on Crimson Lycans first &mdash; they deal the most damage to your NPC ally.</p></div><div class="chapter-card fade-in" id="chapter11"><div class="chapter-number">11</div><div class="chapter-label">Penultimate Chapter &bull; 50&ndash;65 min</div><div class="chapter-title">THE FINAL DESCENT</div><p>This chapter descends into the heart of the dimensional rift. The environment is surreal and constantly shifting. Follow the red light to navigate the shifting corridors and avoid dead ends.</p><p><strong>Key objectives:</strong> Navigate the shifting corridors, defeat the Amalgam boss in the central chamber, recover the Requiem Key, and make final preparations before the endgame.</p><p><strong>Boss: The Amalgam.</strong> A horrific fusion of every major enemy type. It cycles through forms: Lycan Form (fast melee, use rifle), Abomination Form (slow tentacle attacks, use pillars), Shadow Form (phases in/out, shotgun when visible), and Final Form at 25% HP (combines all three &mdash; use explosive canisters that respawn every 30 seconds).</p></div><div class="video-embed"><iframe src="https://www.youtube.com/embed/jGCAnIVN0y8" title="Resident Evil Requiem Final Boss - All Phases" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div><p class="video-caption">Final boss encounter &mdash; all phases of the Chapter XII showdown</p><div class="chapter-card fade-in" id="chapter12"><div class="chapter-number">12</div><div class="chapter-label">Finale &bull; 40&ndash;60 min</div><div class="chapter-title">REQUIEM</div><p>The final chapter. The final boss has multiple phases that mirror the entire game arc, escalating in intensity and requiring different weapon strategies for each phase.</p><p><strong>Pre-fight checklist:</strong> Full health, maximum ammunition for every weapon type, at least 3 First Aid Meds, and all weapons fully upgraded.</p><p>The ending you receive depends on your choices throughout the game and whether you collected all six Lore Fragments. See our <a href="endings.html">All Endings Explained</a> guide for details.</p></div><h2 id="faq">FAQ: RESIDENT EVIL REQUIEM CHAPTERS</h2><div class="tip-card"><div class="tip-number">Q1</div><h3>How many chapters are in Resident Evil Requiem?</h3><p>Resident Evil Requiem has <strong>12 chapters</strong> divided into three acts. Act I (Chapters I&ndash;III) covers the estate exploration. Act II (Chapters IV&ndash;VI) introduces betrayal and the laboratory. Act III (Chapters VII&ndash;XII) takes the game into dimensional horror and the final confrontation.</p></div><div class="tip-card"><div class="tip-number">Q2</div><h3>How long does it take to beat all 12 chapters?</h3><p>A first playthrough on Standard difficulty takes approximately <strong>10&ndash;14 hours</strong>. Completionist runs with all collectibles and secrets can take 25&ndash;30 hours. Speedrunners have completed the game in under 3 hours.</p></div><div class="tip-card"><div class="tip-number">Q3</div><h3>Which chapter is the hardest?</h3><p>Most players find <strong>Chapter XI (The Final Descent)</strong> to be the most challenging due to the Amalgam boss fight and the extremely tight resource economy. Chapter VI is a close second.</p></div><div class="tip-card"><div class="tip-number">Q4</div><h3>Can I replay specific chapters?</h3><p>Yes, after completing the game you unlock Chapter Select from the main menu. Your inventory carries over between chapter replays.</p></div><div class="tip-card"><div class="tip-number">Q5</div><h3>Which chapters have boss fights?</h3><p>Four chapters have mandatory boss fights: <strong>Chapter III</strong> (The Bloated Lycan), <strong>Chapter VI</strong> (The Abomination), <strong>Chapter XI</strong> (The Amalgam), and <strong>Chapter XII</strong> (Final Boss). Chapter VIII has the Shadow Stalker mini-boss, and Chapter IX has the optional Forgotten King boss.</p></div><div class="tip-card"><div class="tip-number">Q6</div><h3>What is the longest chapter?</h3><p><strong>Chapter IX (The Forgotten City)</strong> is the longest chapter at 70&ndash;100 minutes. It features the game's largest open explorable area. Chapter II (Echoes of the Estate) is the second longest at 60&ndash;90 minutes.</p></div><div class="info-box"><p><strong>Looking for more?</strong> Check out our <a href="walkthrough.html">Complete Walkthrough</a> for detailed step-by-step guidance for every chapter. For story analysis, see our <a href="leon-scene.html">Leon Nurse Scene Explained</a> article.</p></div><h2>FINAL THOUGHTS</h2><p>Resident Evil Requiem's 12 chapters deliver one of the most ambitious narratives in the franchise's history. The three-act structure ensures that the game never feels repetitive &mdash; each act introduces new mechanics, new environments, and new threats that keep the experience fresh from start to finish.</p><p>Whether you are a longtime Resident Evil fan or a newcomer drawn in by the hype, these 12 chapters offer approximately 15 hours of tightly designed survival horror that rewards exploration, patience, and strategic thinking. Every chapter builds upon the last, and the payoff in Chapter XII makes the entire journey worthwhile.</p><p>For detailed guidance on every chapter, visit our <a href="walkthrough.html">Complete Walkthrough</a>. For tips on getting started, see our <a href="beginner-guide.html">Beginner Guide</a>. And for the full breakdown of every possible ending, read our <a href="endings.html">All Endings Explained</a> guide.</p><a href="index.html" class="back-link">&larr; BACK TO ALL GUIDES</a></div></article><section class="related"><h3 class="related-title">MORE GUIDES</h3><div class="related-links"><a href="walkthrough.html">Complete Walkthrough</a><a href="beginner-guide.html">Beginner Guide</a><a href="leon-scene.html">Leon Scene Analysis</a><a href="endings.html">All Endings Explained</a><a href="index.html">Home</a></div></section><footer class="footer"><div class="footer-logo">RE:REQUIEM GUIDE</div><p class="footer-text">Fan-made strategy guide &bull; Not affiliated with Capcom &bull; Updated June 2026</p></footer><script>(function(){var u=encodeURIComponent(window.location.href);var t=encodeURIComponent(document.title);document.getElementById("share-twitter").href="https://twitter.com/intent/tweet?url="+u+"&text="+t;document.getElementById("share-facebook").href="https://www.facebook.com/sharer/sharer.php?u="+u;document.getElementById("share-reddit").href="https://reddit.com/submit?url="+u+"&title="+t;document.getElementById("share-whatsapp").href="https://api.whatsapp.com/send?text="+t+"%20"+u})();function copyLink(){navigator.clipboard.writeText(window.location.href).then(function(){var b=document.getElementById("share-copy");b.classList.add("copied");b.title="Copied!";setTimeout(function(
